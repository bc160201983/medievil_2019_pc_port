name: Build and release (Windows)

# Every push and pull request builds the port and keeps medievil-windows.zip as an artifact.
# A tag v* (for example v1.0.0) also publishes it as a GitHub release.
on:
  push:
    branches: [main, medievil]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # PyInstaller freezes the launcher with a python.org-style Windows Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          path-type: inherit
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3 mingw-w64-clang-x86_64-fmt mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map mingw-w64-clang-x86_64-xxhash mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis mingw-w64-clang-x86_64-spirv-tools mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross

      - name: Build
        env:
          # Newer CLANG64 libc++ no longer pulls these in transitively for some third-party code.
          CXXFLAGS: -include cstdlib -include cstdio -include cwchar -include cmath -include new
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: '*'
        run: |
          export MSYS2_ROOT="$(cygpath -u "$(cygpath -m /)")"
          bash build.sh

      # gow3_dlss.dll (gpu/dlss_bridge): MSVC with only the parts of NVIDIA's DLSS SDK it links
      # (headers, nvsdk_ngx_s.lib, license). NVIDIA's nvngx_dlss.dll is not shipped (package.sh).
      - name: DLSS bridge
        env:
          CMAKE_EXE: cmake
        run: |
          sdk="$(cygpath -u "$RUNNER_TEMP")/DLSS"
          git clone -q --depth 1 --branch v310.9.16 --filter=blob:none --sparse https://github.com/NVIDIA/DLSS "$sdk"
          git -C "$sdk" sparse-checkout set --no-cone /include/ /lib/Windows_x86_64/x64/nvsdk_ngx_s.lib \
              /lib/Windows_x86_64/rel/nvngx_dlss.dll /LICENSE.txt
          DLSS_SDK_ROOT="$sdk" bash packaging/windows/build_dlss.sh
          rm -f out/nvngx_dlss.dll

      - name: Package
        run: |
          export MSYS2_ROOT="$(cygpath -u "$(cygpath -m /)")"
          export WINPYTHON="$(cygpath -u "$pythonLocation")/python.exe"
          bash packaging/windows/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: medievil-windows
          path: dist/medievil-windows.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/medievil-windows.zip
          generate_release_notes: true
          body: |
            **MediEvil (PS4, CUSA11227) for PC.** No game files are included: you need your own
            copy (unpacked folder or fake .pkg).

            1. Download `medievil-windows.zip`, extract it (not inside the zip).
            2. Open `MediEvil.exe` (unsigned: More info, Run anyway).
            3. Game page: **Choose .pkg…** to install from your package, or **Browse…** to the
               folder with `eboot.bin`.
            4. Pick a Render resolution (up to 4K) and press **PLAY**.

            Needs Windows 10/11 64-bit and a Vulkan 1.3 GPU. See README-Windows.txt in the zip.
